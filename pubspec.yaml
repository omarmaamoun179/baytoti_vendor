name: baytoti_vendor
description: "Baytouti — the producing family's (vendor's) app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5

  # Functional error handling — Either<Failure, T>
  dartz: ^0.10.1

  # Routing
  go_router: ^17.1.0

  # Dependency injection
  get_it: ^9.2.1

  # Networking
  dio: ^5.7.0
  internet_connection_checker_plus: ^2.7.2

  # Storage
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^10.0.0

  # Localization & formatting
  easy_localization: ^3.0.7
  intl: ^0.20.2
  timezone: ^0.10.0

  # UI
  flutter_screenutil: ^5.9.3
  intl_phone_number_input: ^0.7.5
  toastification: ^3.0.2
  # The design's own stroke icons, drawn from their SVG paths rather than
  # approximated with Material glyphs.
  flutter_svg: ^2.0.17

  # Infinite scroll for paged lists. Vendored rather than pulled from pub.dev:
  # every published version caps at `sdk: <3.0.0`, so pub cannot resolve it.
  # See third_party/.../VENDORING.md.
  lazy_load_scrollview:
    path: third_party/lazy_load_scrollview

  # Debounces search boxes that hit the server — one request per pause, not
  # per keystroke.
  rxdart: ^0.28.0

  # Remote imagery.
  cached_network_image: ^3.4.1

  # Device / platform
  # Product and cover photos, picked from the gallery. The Android and
  # interface packages are named only to switch Android to the system Photo
  # Picker, which needs no storage permission.
  image_picker: ^1.2.1
  image_picker_android: ^0.8.13+23
  image_picker_platform_interface: ^2.11.1
  package_info_plus: ^10.0.0
  url_launcher: ^6.3.1
  device_preview: ^1.3.1
  requests_inspector: ^5.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  # The screen tour in integration_test/, run on a simulator with
  # `flutter drive` to photograph every screen.
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# connectivity_plus >= 7.1.1 calls NWPath.isUltraConstrained, which only exists
# in the iOS/macOS 26 SDK (Xcode 26). Pinned to the last version without it —
# drop this override once the toolchain is on Xcode 26.
dependency_overrides:
  connectivity_plus: 7.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/translations/

  # The design sets every line in `'Archivo','IBM Plex Sans Arabic'`: Archivo
  # draws Latin text and figures, and Arabic falls through to Plex (see
  # AppStrings.fontFamilyFallback).
  fonts:
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Archivo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Archivo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Archivo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Archivo-ExtraBold.ttf
          weight: 800
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700

# Run `dart run flutter_launcher_icons` after changing this block.
# The source is the vendor icon in Claude Design's "Baytouti App Icons",
# kept as SVG beside the PNGs (assets/icons/) and rendered at 1024.
# Android's adaptive icon is two layers: the amber square is the background
# colour, and the foreground is the disc and mark on transparent, at the
# same scale, so the mark sits inside the 66dp safe zone (inset 0). The 1024
# is rendered without an alpha channel, which App Store Connect rejects;
# `remove_alpha_ios` keeps it that way.
flutter_launcher_icons:
  image_path: "assets/icons/vendor-icon-1024.png"
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#D9822A"
  adaptive_icon_foreground: "assets/icons/vendor-icon-foreground-1024.png"
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 21
